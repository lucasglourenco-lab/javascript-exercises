<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="box">
    <div class="visor">
      <p id="result">0</p>
    </div>

    <div class="buttons">
      <button class="gray" id="clear">C</button>

      <button class="gray" id="backs">⌫</button>
      <button class="operations" id="division">÷</button>
      <button class="numbers">7</button>
      <button class=" numbers">8</button>
      <button class="numbers">9</button>
      <button class=" operations" id="multiplication">x</button>
      <button class="numbers">4</button>
      <button class=" numbers">5</button>
      <button class="numbers">6</button>
      <button class=" operations" id="subtraction">-</button>
      <button class="numbers">1</button>
      <button class=" numbers">2</button>
      <button class="numbers">3</button>
      <button class=" operations" id="add">+</button>
      <button class="numbers" id="zero">0</button>
      <button class=" numbers" id="decimal">.</button>
      <button id="equal">=</button>
    </div>

  </div>




  <script src="script.js"></script>
</body>

</html>
